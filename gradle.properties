# 小德社区 - Gradle 全局配置
# Xiaode Community - Gradle global configuration

# ---- 构建性能 ----
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official
kotlin.incremental=true

# ============================================================
# 签名配置（本地开发用，切勿提交真实密码）
#
# 在项目根目录创建 gradle.properties.local 或在 ~/.gradle/gradle.properties
# 中配置以下两项，然后本文件会被覆盖：
#
#   XIAODE_STORE_PASSWORD=你的密钥库密码
#   XIAODE_KEY_PASSWORD=你的密钥别名密码
#
# 或使用环境变量：
#   export ORG_GRADLE_PROJECT_XIAODE_STORE_PASSWORD=xxx
#   export ORG_GRADLE_PROJECT_XIAODE_KEY_PASSWORD=xxx
#
# 若需要自行签名发版，请用 keytool 生成自己的 keystore：
#   keytool -genkey -v -keystore xiaode.keystore -alias xiaode \
#           -keyalg RSA -keysize 2048 -validity 10000
# ============================================================
# XIAODE_STORE_PASSWORD=
# XIAODE_KEY_PASSWORD=
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>小德社区 · 审核端</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:#f4f6fb;color:#1f2430;font-size:14px}
.hide{display:none!important}

/* ============ 登录页 ============ */
#loginPage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
background:linear-gradient(135deg,#5b6ef5 0%,#7c5cff 50%,#a855f7 100%);overflow:hidden}
#loginPage::before,#loginPage::after{content:"";position:absolute;border-radius:50%;
background:rgba(255,255,255,.12);pointer-events:none}
#loginPage::before{width:320px;height:320px;top:-100px;right:-90px}
#loginPage::after{width:220px;height:220px;bottom:-80px;left:-60px;background:rgba(255,255,255,.08)}
.login-card{position:relative;z-index:2;width:100%;max-width:380px;background:rgba(255,255,255,.97);
border-radius:20px;padding:34px 26px 26px;box-shadow:0 20px 60px rgba(30,20,80,.28);
animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.logo{width:60px;height:60px;border-radius:18px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#5b6ef5,#a855f7);box-shadow:0 8px 20px rgba(91,110,245,.35);font-size:28px}
.login-card h1{margin:0 0 6px;font-size:20px;text-align:center;letter-spacing:.5px}
.login-card .sub{text-align:center;color:#8a93a8;font-size:12.5px;margin-bottom:26px}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:12px;color:#7b8398;margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:12px 14px;border:1.5px solid #e3e7f1;border-radius:11px;font-size:14.5px;
background:#fafbfe;transition:all .18s;outline:none;font-family:inherit}
.field input:focus{border-color:#7c5cff;background:#fff;box-shadow:0 0 0 3px rgba(124,92,255,.12)}
.field input::placeholder{color:#b8bfd0}
#loginBtn{width:100%;padding:13px;border:0;border-radius:11px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;
background:linear-gradient(135deg,#5b6ef5,#7c5cff);box-shadow:0 6px 18px rgba(91,110,245,.35);
transition:transform .12s,box-shadow .18s,opacity .18s;font-family:inherit;margin-top:6px}
#loginBtn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(91,110,245,.3)}
#loginBtn:disabled{opacity:.65;cursor:not-allowed}
.login-tip{margin-top:16px;text-align:center;font-size:11.5px;color:#a0a8bc;line-height:1.6}
.login-err{margin-top:12px;padding:9px 12px;background:#fff1f1;border:1px solid #ffd9d9;color:#d33;
border-radius:9px;font-size:12.5px;display:none}
.login-err.on{display:block;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ============ 主界面 ============ */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eaeef6;
padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px}
.topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:#22b573;
box-shadow:0 0 0 3px rgba(34,181,115,.18)}
.who{font-size:12.5px;color:#8a93a8}
.who b{color:#4a5570;font-weight:600}
.btn-out{padding:7px 14px;border:1px solid #e3e7f1;background:#fff;border-radius:9px;
font-size:12.5px;color:#5b6478;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-out:hover{background:#f6f8fd;border-color:#d2d8e8}

.wrap{padding:16px;max-width:900px;margin:0 auto}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 16px;border:1px solid #e3e7f1;background:#fff;border-radius:999px;
font-size:13px;color:#5b6478;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,#5b6ef5,#7c5cff);color:#fff;border-color:transparent;
box-shadow:0 4px 14px rgba(91,110,245,.3);font-weight:600}

.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;
box-shadow:0 1px 3px rgba(20,30,60,.06);border:1px solid #eef1f8}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:linear-gradient(135deg,#f8f9ff,#f2f4ff);border:1px solid #e8ecfa;
border-radius:13px;padding:16px;text-align:center}
.stat .n{font-size:26px;font-weight:700;color:#5b6ef5;line-height:1.2}
.stat .l{font-size:12px;color:#8a93a8;margin-top:5px}
.stat.warn{background:linear-gradient(135deg,#fffaf2,#fff5e6);border-color:#ffe9c9}
.stat.warn .n{color:#e8912d}
.stat.ok{background:linear-gradient(135deg,#f3fdf8,#eafaf2);border-color:#d3f2e3}
.stat.ok .n{color:#22b573}

.tool-line{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
select{padding:8px 12px;border:1px solid #e3e7f1;border-radius:9px;font-size:13px;
background:#fff;color:#4a5570;font-family:inherit;outline:none;cursor:pointer}
select:focus{border-color:#7c5cff}
.btn-ref{padding:8px 15px;border:1px solid #e3e7f1;background:#fff;border-radius:9px;
font-size:13px;color:#5b6478;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ref:hover{background:#f6f8fd}

.item{border:1px solid #eef1f8;border-radius:12px;padding:14px;margin-bottom:11px;
background:#fff;transition:border-color .15s}
.item:hover{border-color:#dde3f2}
.item .meta{font-size:12px;color:#98a1b5;margin-bottom:7px}
.item .title{font-weight:600;font-size:14.5px;margin-bottom:5px;color:#28304a}
.item .body{font-size:13.5px;color:#556;line-height:1.65;word-break:break-word}
.item img.thumb{width:64px;height:64px;object-fit:cover;border-radius:9px;margin:7px 6px 0 0;
border:1px solid #eef1f8}
.item .acts{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}

.btn{padding:8px 16px;border:0;border-radius:9px;font-size:13px;cursor:pointer;
font-family:inherit;font-weight:500;transition:all .15s}
.btn:active{transform:translateY(1px)}
.btn.k{background:#22b573;color:#fff;box-shadow:0 2px 8px rgba(34,181,115,.28)}
.btn.k:hover{background:#1ea364}
.btn.r{background:#ff5b5b;color:#fff;box-shadow:0 2px 8px rgba(255,91,91,.25)}
.btn.r:hover{background:#f04a4a}
.btn.g{background:#f0f2f9;color:#5b6478}
.btn.g:hover{background:#e7eaf5}

/* BAN_UI_V1 */
.btn.b{background:#6b7fd7;color:#fff;box-shadow:0 2px 8px rgba(107,127,215,.28)}
.btn.b:hover{background:#5a6ec5}
.banmask{position:fixed;inset:0;background:rgba(20,25,40,.45);display:none;
  align-items:center;justify-content:center;z-index:9999;padding:18px}
.banmask.on{display:flex}
.banbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;
  box-shadow:0 18px 50px rgba(20,25,40,.24);max-height:88vh;overflow:auto}
.banbox h3{margin:0 0 4px;font-size:16.5px;color:#28304a}
.banbox .sub{font-size:12.5px;color:#98a1b5;margin-bottom:14px}
.banbox label{display:block;font-size:12.5px;color:#5b6478;margin:11px 0 5px;font-weight:600}
.banbox input[type=text],.banbox select,.banbox textarea{width:100%;box-sizing:border-box;
  padding:10px 12px;border:1px solid #e3e7f1;border-radius:10px;font-size:13.5px;
  font-family:inherit;outline:none;background:#fbfcff}
.banbox input[type=text]:focus,.banbox select:focus,.banbox textarea:focus{
  border-color:#6b7fd7;background:#fff}
.banbox .chk{display:flex;align-items:flex-start;gap:8px;margin-top:13px;font-size:12.5px;
  color:#5b6478;line-height:1.5}
.banbox .chk input{margin-top:2px;flex:none}
.banbox .foot{display:flex;gap:9px;margin-top:18px}
.banbox .foot .btn{flex:1;padding:11px 0;text-align:center}
.badge-ban{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  background:#ffe9e9;color:#e04a4a;font-weight:600;margin-left:6px}


.tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.pend{background:#fff5e0;color:#c8860b}
.appr{background:#e2f8ec;color:#16885a}
.rej{background:#ffe8e8;color:#d83b3b}

.muted{color:#98a1b5;font-size:12.5px}
.empty{text-align:center;padding:40px 16px;color:#b0b8c9;font-size:13px}
.empty .ico{font-size:34px;margin-bottom:10px;opacity:.55}

#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
background:rgba(31,36,48,.95);color:#fff;padding:11px 22px;border-radius:11px;font-size:13.5px;
opacity:0;transition:all .25s;pointer-events:none;z-index:9999;
box-shadow:0 8px 26px rgba(0,0,0,.24);white-space:nowrap;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
.login-card{padding:28px 20px 22px;border-radius:17px}
.login-card h1{font-size:18.5px}
.wrap{padding:13px}
.card{padding:13px;border-radius:12px}
.stat .n{font-size:22px}
}
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="loginPage">
  <div class="login-card">
    <div class="logo">🛡️</div>
    <h1>小德社区 · 审核端</h1>
    <div class="sub">Reviewer Console</div>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label>审核员账号</label>
        <input id="u" name="username" placeholder="请输入账号" autocomplete="username" autocapitalize="off"/>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="p" name="password" type="password" placeholder="请输入密码" autocomplete="current-password"/>
      </div>
      <button id="loginBtn" type="submit">登 录</button>
    </form>
    <div class="login-err" id="loginErr"></div>
    <div class="login-tip">审核员账号由管理员在后台创建<br/>审核过程匿名，不会显示用户昵称与头像</div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="mainPage" class="hide">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>审核端</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="who">审核员 <b id="who">-</b></span>
      <button class="btn-out" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button id="t0" class="on" onclick="showTab(0)">概览</button>
      <button id="t1" onclick="showTab(1)">帖子审核</button>
      <button id="t2" onclick="showTab(2)">应用审核</button>
      <button id="t5" onclick="showTab(5)">工具审核</button>
      <button id="t3" onclick="showTab(3)">频道</button>
      <button id="t4" onclick="showTab(4)">举报</button>
      <button id="t6" onclick="showTab(6)">资源审核</button>
      <button id="t7" onclick="showTab(7)">封禁名单</button><!-- BAN_UI_V2 -->
    </div>

    <div class="card" id="pane0"><div id="statsBox"><div class="empty"><div class="ico">⏳</div>加载中...</div></div></div>

    <div class="card hide" id="pane1">
      <div class="tool-line">
        <select id="mSt" onchange="loadMoments()">
          <option value="pending">待审核</option><option value="approved">已通过</option>
          <option value="rejected">已驳回</option><option value="">全部</option>
        </select>
        <button class="btn-ref" onclick="loadMoments()">刷新</button>
      </div>
      <div id="mList"></div>
    </div>

    <div class="card hide" id="pane2">
      <div class="tool-line">
        <select id="aSt" onchange="loadApps()">
          <option value="pending">待审核</option><option value="approved">已通过</option>
          <option value="rejected">已驳回</option><option value="">全部</option>
        </select>
        <button class="btn-ref" onclick="loadApps()">刷新</button>
      </div>
      <div id="aList"></div>
    </div>

    <div class="card hide" id="pane5">
      <div class="tool-line">
        <select id="tlSt" onchange="loadTools()">
          <option value="pending">待审核</option><option value="approved">已通过</option>
          <option value="rejected">已驳回</option><option value="">全部</option>
        </select>
        <button class="btn-ref" onclick="loadTools()">刷新</button>
      </div>
      <div id="tList"></div>
    </div>

    <div class="card hide" id="pane3">
      <div class="tool-line">
        <select id="cSt" onchange="loadChannels()">
          <option value="pending">待审核</option><option value="approved">已通过</option>
          <option value="rejected">已驳回</option><option value="">全部</option>
        </select>
        <button class="btn-ref" onclick="loadChannels()">刷新</button>
      </div>
      <div id="cList"></div>
    </div>

    <div class="card hide" id="pane4">
      <div class="tool-line">
        <select id="rSt" onchange="loadReports()">
          <option value="pending">待处理</option><option value="handled">已处理</option>
          <option value="dismissed">已忽略</option><option value="">全部</option>
        </select>
        <button class="btn-ref" onclick="loadReports()">刷新</button>
      </div>
      <div id="rList"></div>
    </div>
    <div class="card hide" id="pane6">
      <div class="tool-line">
        <select id="rsSt" onchange="loadRes()">
          <option value="pending">待审核</option><option value="approved">已通过</option>
          <option value="rejected">已驳回</option><option value="">全部</option>
        </select>
        <button class="btn-ref" onclick="loadRes()">刷新</button>
      </div>
      <div id="rsList"></div>
    </div>
    <!-- BAN_UI_V2: 封禁名单 -->
    <div class="card hide" id="pane7">
      <div class="tool-line">
        <span style="font-size:13px;color:#5b6478;font-weight:600">被封禁用户</span>
        <button class="btn-ref" onclick="loadBans()">刷新</button>
      </div>
      <div id="banList"></div>
    </div>
  </div>
</div>

<!-- BAN_UI_V2: 封禁弹窗 -->
<div class="banmask" id="banMask" onclick="if(event.target===this)closeBan()">
  <div class="banbox">
    <h3>封禁用户</h3>
    <div class="sub" id="banWho">用户ID: -</div>

    <label>封禁理由（必填，会通知给用户）</label>
    <input type="text" id="banReason" placeholder="例如：发布违规广告 / 涉黄 / 恶意灌水" maxlength="100">

    <label>封禁时长</label>
    <select id="banDays">
      <option value="0">永久封禁</option>
      <option value="1">1 天</option>
      <option value="3">3 天</option>
      <option value="7">7 天</option>
      <option value="30">30 天</option>
      <option value="90">90 天</option>
    </select>

    <div class="chk">
      <input type="checkbox" id="banRemove" checked>
      <span>同时下架该用户的全部帖子（置为已驳回，数据保留可追溯）</span>
    </div>

    <div class="foot">
      <button class="btn g" onclick="closeBan()">取消</button>
      <button class="btn r" onclick="doBan()">确认封禁</button>
    </div>
  </div>
</div>

<!-- 审核协议弹窗 -->
<div id="agWrap" style="display:none;position:fixed;inset:0;background:rgba(15,20,40,.72);z-index:9999;overflow:auto;padding:20px">
  <div style="max-width:760px;margin:20px auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden">
    <div style="padding:20px 24px;background:linear-gradient(135deg,#5b6ef5,#7c5cff);color:#fff">
      <div style="font-size:19px;font-weight:800" id="agTitle">审核员责任协议书</div>
      <div style="font-size:12.5px;opacity:.85;margin-top:5px" id="agVer">请完整阅读以下条款</div>
    </div>
    <div id="agBody" style="padding:20px 24px;max-height:56vh;overflow:auto;font-size:13.5px;line-height:1.9;color:#333;white-space:pre-wrap;word-break:break-word">加载中...</div>
    <div style="padding:14px 24px 20px;border-top:1px solid #eef1f8;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fafbff">
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#333;cursor:pointer;flex:1;min-width:220px">
        <input type="checkbox" id="agChk" onchange="document.getElementById('agSign').disabled=!this.checked" style="width:17px;height:17px;cursor:pointer">
        我已完整阅读并理解以上全部条款，自愿承担相应审核责任
      </label>
      <button id="agSign" disabled onclick="doSignAgreement()"
        style="padding:11px 26px;border:0;border-radius:999px;background:linear-gradient(135deg,#5b6ef5,#7c5cff);color:#fff;font-size:14px;font-weight:700;cursor:pointer">
        同意并签署
      </button>
      <button onclick="logout()" style="padding:11px 20px;border:1px solid #dfe4f0;border-radius:999px;background:#fff;color:#666;font-size:13.5px;cursor:pointer">退出登录</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="/static/reviewer_tools.js"></script>
<script>
var TK = localStorage.getItem("rvtk") || "";

function tt(m){
  var t=document.getElementById("toast");
  t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},1900);
}
function esc(s){
  var str=String(s==null?"":s);
  var out="";
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c===38)out+="&"+String.fromCharCode(97,109,112)+";";
    else if(c===60)out+="&"+String.fromCharCode(108,116)+";";
    else if(c===62)out+="&"+String.fromCharCode(103,116)+";";
    else if(c===34)out+="&"+String.fromCharCode(113,117,111,116)+";";
    else if(c===39)out+="&"+String.fromCharCode(35,51,57)+";";
    else out+=str.charAt(i);
  }
  return out;
}
async function rq(path,opt){
  opt=opt||{};
  opt.headers=opt.headers||{};
  if(TK)opt.headers["Authorization"]="Bearer "+TK;
  if(opt.body&&typeof opt.body!=="string"){opt.body=JSON.stringify(opt.body);}
  if(opt.body)opt.headers["Content-Type"]="application/json";
  var r=await fetch(path,opt);
  var txt=await r.text();
  var d;try{d=txt?JSON.parse(txt):{};}catch(e){d={detail:txt};}
  if(r.status===401){TK="";localStorage.removeItem("rvtk");showLogin();}
  if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));
  return d;
}
function stx(s){return s==="pending"?"待审":s==="approved"?"已通过":s==="rejected"?"已驳回":s==="handled"?"已处理":s==="dismissed"?"已忽略":s;}
function tg(s){
  var c=s==="pending"?"pend":(s==="approved"?"appr":"rej");
  return '<span class="tag '+c+'">'+stx(s)+'</span>';
}
function fmtT(s){
  if(!s)return "-";
  return String(s).replace("T"," ").slice(0,16);
}

/* ============ 登录 ============ */
function showLogin(){
  document.getElementById("loginPage").classList.remove("hide");
  document.getElementById("mainPage").classList.add("hide");
  var e=document.getElementById("loginErr");e.classList.remove("on");
}
function showErr(msg){
  var e=document.getElementById("loginErr");
  e.textContent=msg;e.classList.add("on");
}

async function doLogin(ev){
  if(ev)ev.preventDefault();
  var u=document.getElementById("u").value.trim();
  var p=document.getElementById("p").value;
  var btn=document.getElementById("loginBtn");
  if(!u||!p){showErr("请输入账号和密码");return;}
  btn.disabled=true;
  var old=btn.textContent;
  btn.textContent="登录中...";
  document.getElementById("loginErr").classList.remove("on");
  try{
    var d=await rq("/api/reviewer/login",{method:"POST",body:{username:u,password:p}});
    TK=d.access_token||d.token;
    localStorage.setItem("rvtk",TK);
    await enter();
  }catch(e){
    showErr("登录失败："+(e.message||"请检查账号密码"));
  }finally{
    btn.disabled=false;btn.textContent=old;
  }
}

async function enter(){
  try{
    var me=await rq("/api/reviewer/me");
    document.getElementById("who").textContent=me.nickname||me.username;
    document.getElementById("loginPage").classList.add("hide");
    document.getElementById("mainPage").classList.remove("hide");
    // resreview_fe 检查协议签署状态
    var st=null;
    try{ st=await rq("/api/reviewer/agreement/status"); }catch(e){}
    if(st && !st.signed){
      await openAgreement();
    }
    showTab(0);
  }catch(e){
    TK="";localStorage.removeItem("rvtk");showLogin();

/* ============ resreview_fe 审核协议 ============ */
var AG_VER="v1";
async function openAgreement(){
  var wrap=document.getElementById("agWrap");
  wrap.style.display="block";
  try{
    var a=await rq("/api/reviewer/agreement");
    AG_VER=a.version||"v1";
    document.getElementById("agTitle").textContent=a.title||"审核员责任协议书";
    document.getElementById("agVer").textContent="协议版本 "+AG_VER+" · 请完整阅读以下条款";
    document.getElementById("agBody").textContent=a.text||"";
  }catch(e){
    document.getElementById("agBody").textContent="协议加载失败："+(e.message||"");
  }
  document.getElementById("agChk").checked=false;
  document.getElementById("agSign").disabled=true;
}
async function doSignAgreement(){
  var btn=document.getElementById("agSign");
  if(!document.getElementById("agChk").checked){tt("请先勾选同意");return;}
  btn.disabled=true;
  var old=btn.textContent;
  btn.textContent="签署中...";
  try{
    await rq("/api/reviewer/agreement/sign",{method:"POST",body:{version:AG_VER,agreed:true}});
    document.getElementById("agWrap").style.display="none";
    tt("协议已签署，可以开始审核");
    showTab(0);
  }catch(e){
    tt("签署失败："+(e.message||""));
    btn.disabled=false;btn.textContent=old;
  }
}
async function showAgreementAgain(){
  document.getElementById("agChk").checked=true;
  document.getElementById("agSign").disabled=false;
  document.getElementById("agSign").onclick=async function(){
    var r=await rq("/api/reviewer/agreement");
    alert(r.text);
    document.getElementById("agWrap").style.display="none";
  };
  await openAgreement();
}

function logout(){
  if(!confirm("确认退出登录？"))return;
  TK="";localStorage.removeItem("rvtk");
  document.getElementById("u").value="";
  document.getElementById("p").value="";
  showLogin();
}

document.getElementById("loginForm").addEventListener("submit",doLogin);

/* ============ Tab ============ */
function showTab(n){
  for(var i=0;i<8;i++){
    var pane=document.getElementById("pane"+i);
    var tab=document.getElementById("t"+i);
    if(pane)pane.classList.toggle("hide",i!==n);
    if(tab)tab.classList.toggle("on",i===n);
  }
  if(n===0)loadStats();
  if(n===1)loadMoments();
  if(n===2)loadApps();
  if(n===7)loadBans();
  if(n===3)loadChannels();
  if(n===4)loadReports();
  if(n===5&&typeof loadTools==="function")loadTools();
  if(n===6)loadRes();
}

/* ============ 概览 ============ */
async function loadStats(){
  var box=document.getElementById("statsBox");
  try{
    var s=await rq("/api/reviewer/stats");
    var h='<div class="stat-grid">';
    h+='<div class="stat warn"><div class="n">'+(s.moment_pending||0)+'</div><div class="l">待审帖子</div></div>';
    h+='<div class="stat warn"><div class="n">'+(s.app_pending||0)+'</div><div class="l">待审应用</div></div>';
    h+='<div class="stat warn"><div class="n">'+(s.resource_pending||0)+'</div><div class="l">待审资源</div></div>';
    h+='<div class="stat warn"><div class="n">'+(s.report_pending||0)+'</div><div class="l">待处理举报</div></div>';
    if(typeof s.tool_pending==="number")
      h+='<div class="stat warn"><div class="n">'+s.tool_pending+'</div><div class="l">待审工具</div></div>';
    if(typeof s.channel_pending==="number")
      h+='<div class="stat"><div class="n">'+s.channel_pending+'</div><div class="l">待审频道</div></div>';
    h+='</div>';
    box.innerHTML=h;
  }catch(e){
    box.innerHTML='<div class="empty"><div class="ico">⚠️</div>加载失败：'+esc(e.message)+'</div>';
  }
}

/* ============ 帖子 ============ */
async function loadMoments(){
  var st=document.getElementById("mSt").value;
  var el=document.getElementById("mList");
  el.innerHTML='<div class="empty">加载中...</div>';
  try{
    var l=await rq("/api/reviewer/moments?st="+encodeURIComponent(st));
    if(!l.length){el.innerHTML='<div class="empty"><div class="ico">📭</div>暂无内容</div>';return;}
    var out=[];
    for(var i=0;i<l.length;i++){
      var m=l[i];
      var imgs="";
      var arr=m.images||[];
      for(var j=0;j<arr.length;j++){
        imgs+='<img class="thumb" src="'+esc(arr[j])+'"/>';
      }
      out.push('<div class="item">');
      out.push('<div class="meta">#'+m.id+' · 用户ID:'+(m.author_id||"?")+' · '+fmtT(m.created_at)+' '+tg(m.status)+'</div>');
      out.push('<div class="title">'+esc(m.title||"(无标题)")+'</div>');
      out.push('<div class="body">'+esc(m.content||"")+'</div>');
      if(imgs)out.push('<div>'+imgs+'</div>');
      // BAN_UI_V1: 不论状态都给出操作按钮（已通过的帖子之前无法再驳回）
      out.push('<div class="acts">');
      if(m.status==="pending"){
        out.push('<button class="btn k" onclick="rvM('+m.id+',1)">通过</button>');
        out.push('<button class="btn r" onclick="rvM('+m.id+',0)">驳回</button>');
      }else if(m.status==="approved"){
        out.push('<button class="btn r" onclick="rvM('+m.id+',0)">改判驳回</button>');
      }else if(m.status==="rejected"){
        out.push('<button class="btn k" onclick="rvM('+m.id+',1)">改为通过</button>');
      }
      out.push('<button class="btn b" onclick="openBan('+(m.author_id||0)+',\''+
               esc((m.title||"(无标题)").replace(/'/g,"")).substring(0,24)+'\')">封禁作者</button>');
      out.push('</div>');
      out.push('</div>');
    }
    el.innerHTML=out.join("");
  }catch(e){
    el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';
  }
}
/* ============ BAN_UI_V1 封禁用户 ============ */
var BAN_UID=0;

function openBan(uid, hint){
  if(!uid){ tt("无法获取作者ID"); return; }
  BAN_UID=uid;
  document.getElementById("banWho").textContent = "用户ID: "+uid+(hint?" · 帖子《"+hint+"》":"");
  document.getElementById("banReason").value="";
  document.getElementById("banDays").value="0";
  document.getElementById("banRemove").checked=true;
  document.getElementById("banMask").classList.add("on");
  // 顺带查一下该用户当前状态
  rq("/api/reviewer/users/"+uid).then(function(u){
    var t="用户ID: "+uid;
    if(u.nickname) t+=" · "+u.nickname;
    t+=" · 已发布 "+u.post_count+" 篇";
    if(u.is_banned) t+=" · 已被封禁";
    document.getElementById("banWho").textContent=t;
  }).catch(function(){});
}
function closeBan(){
  document.getElementById("banMask").classList.remove("on");
}
async function doBan(){
  var reason=document.getElementById("banReason").value.trim();
  if(!reason){ tt("请填写封禁理由"); return; }
  var days=parseInt(document.getElementById("banDays").value||"0",10);
  var rm=document.getElementById("banRemove").checked;
  try{
    var r=await rq("/api/reviewer/users/"+BAN_UID+"/ban",{method:"POST",
      body:{ban:true,reason:reason,days:days,remove_posts:rm}});
    tt("已封禁"+(r.posts_removed?("，下架 "+r.posts_removed+" 篇帖子"):""));
    closeBan();
    loadMoments(); loadStats();
  }catch(e){ tt(e.message); }
}
async function unban(uid){
  if(!confirm("确定解除该用户的封禁吗？")) return;
  try{
    await rq("/api/reviewer/users/"+uid+"/ban",{method:"POST",body:{ban:false}});
    tt("已解除封禁");
    loadBans(); loadMoments(); loadStats();
  }catch(e){ tt(e.message); }
}
async function loadBans(){
  var el=document.getElementById("banList");
  if(!el) return;
  el.innerHTML='<div class="empty">加载中...</div>';
  try{
    var l=await rq("/api/reviewer/users");
    if(!l.length){ el.innerHTML='<div class="empty"><div class="ico">🕊️</div>暂无被封禁用户</div>'; return; }
    var out=[];
    for(var i=0;i<l.length;i++){
      var u=l[i];
      out.push('<div class="item">');
      out.push('<div class="meta">用户ID:'+u.id+' · 帖子 '+u.post_count+' 篇 <span class="badge-ban">已封禁</span></div>');
      out.push('<div class="title">'+esc(u.nickname||u.username||("用户"+u.id))+'</div>');
      out.push('<div class="body">理由：'+esc(u.ban_reason||"(未填写)")+
               '<br>解封时间：'+esc(u.ban_until||"永久")+'</div>');
      out.push('<div class="acts">');
      out.push('<button class="btn g" onclick="unban('+u.id+')">解除封禁</button>');
      out.push('</div>');
      out.push('</div>');
    }
    el.innerHTML=out.join("");
  }catch(e){ el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

async function rvM(id,ok){
  try{
    await rq("/api/reviewer/moments/"+id+"/review",{method:"POST",body:{approve:!!ok}});
    tt(ok?"已通过":"已驳回");
    loadMoments();loadStats();
  }catch(e){tt(e.message);}
}

/* ============ 应用 ============ */

  var st=document.getElementById("aSt").value;

    var l=await rq("/api/reviewer/apps?st="+encodeURIComponent(st));

      var a=l[i];

async function rvA(id,ok){
  var rs="";
  if(!ok){var r=prompt("驳回原因（可留空）：");if(r===null)return;rs=r;}
  try{
    await rq("/api/reviewer/apps/"+id+"/review",{method:"POST",body:{approve:!!ok,reason:rs}});
    tt(ok?"已通过":"已驳回");
    loadApps();loadStats();
  }catch(e){tt(e.message);}
}

/* ============ 频道 ============ */
async function loadChannels(){
  var st=(document.getElementById("cSt")||{}).value||"";
  var el=document.getElementById("cList");
  el.innerHTML='<div class="empty">加载中...</div>';
  try{
    var url="/api/reviewer/channels"+(st?"?st="+encodeURIComponent(st):"");
    var l=await rq(url);
    if(!l.length){el.innerHTML='<div class="empty"><div class="ico">💬</div>暂无频道</div>';return;}
    var out=[];
    for(var i=0;i<l.length;i++){
      var c=l[i];
      out.push('<div class="item">');
      out.push('<div class="meta">#'+c.id+' · 创建者ID:'+(c.owner_id||"?")+' · '+fmtT(c.created_at)+' '+tg(c.status)+'</div>');
      var img=c.image?'<img class="thumb" src="'+esc(c.image)+'"/>':'';
      out.push('<div class="title">'+img+esc(c.name||"")+'</div>');
      out.push('<div class="muted">'+esc(c.intro||c.desc||"")+'</div>');
      out.push('<div class="acts">');
      if(c.status==="pending"){
        out.push('<button class="btn k" onclick="revC('+c.id+',1)">通过</button>');
        out.push('<button class="btn r" onclick="revC('+c.id+',0)">驳回</button>');
      }
      out.push('<button class="btn g" onclick="delC('+c.id+')">删除</button>');
      out.push('</div></div>');

    el.innerHTML=out.join("");
  }catch(e){
    el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';
  }
}
async function revC(id,ok){
  if(!confirm(ok?"确认通过该频道？":"确认驳回该频道？"))return;
  try{
    await rq("/api/reviewer/channels/"+id+"/review",{method:"POST",body:{approve:!!ok}});
    tt(ok?"已通过":"已驳回");loadChannels();loadStats();
  }catch(e){tt(e.message);}
}
async function delC(id){
  if(!confirm("确认删除该频道？不可恢复"))return;
  try{
    await rq("/api/reviewer/channels/"+id,{method:"DELETE"});
    tt("已删除");loadChannels();
  }catch(e){tt(e.message);}
}

/* ============ 举报 ============ */
async function loadReports(){
  var st=document.getElementById("rSt").value;
  var el=document.getElementById("rList");
  el.innerHTML='<div class="empty">加载中...</div>';
  try{
    var l=await rq("/api/reviewer/reports?st="+encodeURIComponent(st));
    if(!l.length){el.innerHTML='<div class="empty"><div class="ico">🚨</div>暂无举报</div>';return;}
    var out=[];
    for(var i=0;i<l.length;i++){
      var r=l[i];
      out.push('<div class="item">');
      out.push('<div class="meta">#'+r.id+' · '+fmtT(r.created_at)+' · 类型:'+esc(r.target_type)+' · 目标ID:'+(r.target_id||0)+' · 举报者ID:'+(r.reporter_id||"?")+' '+tg(r.status)+'</div>');
      out.push('<div class="title">'+esc(r.reason||"")+'</div>');
      if(r.snapshot)out.push('<div class="muted">内容快照：'+esc(r.snapshot)+'</div>');
      if(r.detail)out.push('<div class="body">'+esc(r.detail)+'</div>');
      if(r.status==="pending"){
        out.push('<div class="acts">');
        out.push('<button class="btn g" onclick="hR('+r.id+',\'clean\')">无违规（保留）</button>');
        out.push('<button class="btn k" onclick="hR('+r.id+',\'violation\')">有违规（删除）</button>');
        out.push('</div>');
      }
      out.push('</div>');
    }
    el.innerHTML=out.join("");
  }catch(e){
    el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';
  }
}
async function hR(id,verdict){
  try{
    await rq("/api/reviewer/reports/"+id+"/handle",{method:"POST",body:{verdict:verdict}});
    tt(verdict==="violation"?"已判有违规并删除":"已判无违规");
    loadReports();loadStats();
  }catch(e){tt(e.message);}
}

/* ============ resreview_fe 资源审核 ============ */
async function loadRes(){
  var sel=document.getElementById("rsSt");
  var st=sel?sel.value:"pending";
  var el=document.getElementById("rsList");
  el.innerHTML='<div class="empty">加载中...</div>';
  try{
    var url="/api/reviewer/resources"+(st?"?st="+encodeURIComponent(st):"");
    var l=await rq(url);
    if(!l.length){el.innerHTML='<div class="empty"><div class="ico">📁</div>暂无资源</div>';return;}
    var out=[];
    for(var i=0;i<l.length;i++){
      var r=l[i];
      out.push('<div class="item">');
      out.push('<div class="meta">#'+r.id+' · 上传者ID:'+(r.uploader_id||"?")+' · '+fmtT(r.created_at)+' '+tg(r.status)+'</div>');
      if(r.cover)out.push('<img class="thumb" src="'+esc(r.cover)+'" style="max-width:120px;border-radius:8px;margin-bottom:8px"/>');
      out.push('<div class="title">'+esc(r.name||"")+'</div>');
      if(r.category)out.push('<div class="muted">分类：'+esc(r.category)+' · '+(r.res_type==="file"?"直传文件":"下载链接")+(r.file_size?(' · '+(r.file_size/1048576).toFixed(2)+'MB'):'')+'</div>');
      if(r.is_paid)out.push('<div class="muted">付费资源：'+r.price+' 金币</div>');
      else out.push('<div class="muted">免费资源</div>');
      if(r.summary)out.push('<div class="body">'+esc(r.summary)+'</div>');
      if(r.description)out.push('<div class="body" style="color:#888;font-size:12.5px">'+esc(r.description).slice(0,300)+'</div>');
      if(r.download_url)out.push('<div class="muted" style="word-break:break-all">下载地址：'+esc(r.download_url).slice(0,180)+'</div>');
      if(r.screenshots)out.push('<div class="muted" style="word-break:break-all">演示截图：'+esc(r.screenshots).slice(0,180)+'</div>');
      if(r.reject_reason)out.push('<div class="muted" style="color:#e05555">驳回原因：'+esc(r.reject_reason)+'</div>');
      if(r.status==="pending"){
        out.push('<div class="acts">');
        out.push('<button class="btn k" onclick="rvR('+r.id+',1)">通过</button>');
        out.push('<button class="btn r" onclick="rvR('+r.id+',0)">驳回</button>');
        out.push('<button class="btn" onclick="delR('+r.id+')">删除</button>');
        out.push('</div>');
      }else{
        out.push('<div class="acts">');
        out.push('<button class="btn" onclick="delR('+r.id+')">删除</button>');
        out.push('</div>');
      }
      out.push('</div>');
    }
    el.innerHTML=out.join("");
  }catch(e){
    el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';
  }
}
async function rvR(id,ok){
  var rs="";
  if(!ok){var r=prompt("驳回原因（会显示给上传者，建议写明修改建议）：");if(r===null)return;rs=r;}
  try{
    await rq("/api/reviewer/resources/"+id+"/review",{method:"POST",body:{approve:!!ok,reason:rs}});
    tt(ok?"资源已通过":"资源已驳回");
    loadRes();loadStats();
  }catch(e){tt(e.message);}
}
async function delR(id){
  if(!confirm("确认删除该资源？此操作不可恢复。"))return;
  try{
    await rq("/api/reviewer/resources/"+id,{method:"DELETE"});
    tt("已删除");
    loadRes();loadStats();
  }catch(e){tt(e.message);}
}

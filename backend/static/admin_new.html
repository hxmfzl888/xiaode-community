<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>小德后台</title>
<style>
:root{--pri:#3b6ef5;--pri-d:#2f59d0;--bg:#f5f7fb;--card:#fff;--tx:#1f2430;--mut:#8a94a6;--bd:#e8ecf3;--ok:#22b573;--no:#ff5b5b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--pri);text-decoration:none}
button{cursor:pointer;font-family:inherit}
.hide{display:none!important}
/* ---- 登录页 ---- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef3ff 0%,#f7f9ff 100%);padding:20px}
.lg-card{width:100%;max-width:400px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(59,110,245,.14);padding:34px 30px}
.lg-logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#3b6ef5,#6b9bff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700;margin:0 auto 14px}
.lg-t{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
.lg-s{text-align:center;color:var(--mut);font-size:13px;margin-bottom:22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:#5b6478;margin-bottom:6px;font-weight:500}
.fld input{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;outline:none;transition:.15s}
.fld input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,110,245,.12)}
.cap-row{display:flex;gap:10px}
.cap-row input{flex:1}
.cap-box{width:110px;height:44px;border-radius:10px;background:#eef2fa;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;letter-spacing:3px;color:#3557b7;cursor:pointer;user-select:none;font-style:italic;border:1.5px solid var(--bd)}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:15px;font-weight:600;transition:.15s}
.btn:hover{background:var(--pri-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.lg-err{color:var(--no);font-size:13px;min-height:18px;text-align:center;margin-top:10px}
/* ---- 主布局 ---- */
#app{min-height:100vh}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50}
.burger{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger:hover{background:#f0f4fd}
.burger span{width:22px;height:2.5px;background:#3a4256;border-radius:2px;transition:.2s}
.top-title{font-size:17px;font-weight:700;margin-left:12px}
.top-spacer{flex:1}
.top-user{font-size:13px;color:var(--mut);margin-right:12px}
/* ---- 侧边栏 ---- */
.mask{position:fixed;inset:0;background:rgba(20,26,40,.4);z-index:90;opacity:0;pointer-events:none;transition:.22s}
.mask.on{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;left:0;bottom:0;width:260px;background:#fff;z-index:100;transform:translateX(-100%);transition:.25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.06)}
.side.on{transform:translateX(0)}
.side-h{padding:20px 20px 14px;border-bottom:1px solid var(--bd)}
.side-h .n{font-size:17px;font-weight:700}
.side-h .r{font-size:12px;color:var(--mut);margin-top:2px}
.side-nav{flex:1;overflow-y:auto;padding:10px}
.side-nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#3a4256;font-size:14.5px;font-weight:500;margin-bottom:2px;transition:.12s}
.side-nav a:hover{background:#f0f4fd}
.side-nav a.on{background:var(--pri);color:#fff}
.side-nav .ic{font-size:17px;width:20px;text-align:center}
.side-f{padding:12px;border-top:1px solid var(--bd)}
.side-f button{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:#5b6478;font-size:14px}
.side-f button:hover{background:#fff5f5;color:var(--no);border-color:#ffd5d5}
/* ---- 内容区 ---- */
.main{padding:20px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.stat{background:var(--card);border-radius:14px;padding:16px 18px;border:1px solid var(--bd)}
.stat .k{font-size:13px;color:var(--mut);margin-bottom:8px}
.stat .v{font-size:27px;font-weight:700;line-height:1}
.stat .v small{font-size:13px;color:var(--mut);font-weight:500;margin-left:4px}
.stat .accent{color:var(--pri)}
.sec-title{font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--bd);margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.btn2{padding:9px 16px;border:0;border-radius:9px;background:var(--pri);color:#fff;font-size:14px;font-weight:500}
.btn2:hover{background:var(--pri-d)}
.btn2.g{background:#eef1f8;color:#38415a}
.btn2.r{background:var(--no)}
.btn2.k{background:var(--ok)}
.item{border:1px solid var(--bd);border-radius:11px;padding:13px;margin-bottom:10px}
.item .m{color:var(--mut);font-size:12px;margin-bottom:6px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
.pend{background:#fff3d6;color:#b8860b}.appr{background:#d9f7e8;color:#16885a}.rej{background:#ffe1e1;color:#d33}
.muted{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:11px 20px;border-radius:10px;z-index:9999;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}.main{padding:14px}}
.img-t{width:64px;height:64px;object-fit:cover;border-radius:8px;margin:3px 5px 0 0;border:1px solid var(--bd)}
.file-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.file-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .sz{color:var(--mut);font-size:12px}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px}
</style>
<style>
#cdkMask{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
#cdkMask.on{display:flex}
#cdkBox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:78vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.3)}
#cdkBox .hd{padding:16px 18px;border-bottom:1px solid #eef0f5;display:flex;align-items:center;justify-content:space-between}
#cdkBox .hd b{font-size:16px}
#cdkBox .bd{padding:14px 18px;overflow:auto;flex:1}
#cdkBox .ft{padding:12px 18px;border-top:1px solid #eef0f5;display:flex;gap:8px;justify-content:flex-end}
#cdkTa{width:100%;height:46vh;border:1px solid #e3e7f0;border-radius:10px;padding:12px;font-family:monospace;font-size:13px;line-height:1.7;resize:none;box-sizing:border-box;background:#fafbfe}
.cdkX{background:none;border:0;font-size:22px;cursor:pointer;color:#8a93a6}
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="login">
  <div class="lg-card">
    <div class="lg-logo">德</div>
    <div class="lg-t">小德后台管理系统</div>
    <div class="lg-s">Xiaode Admin Console</div>
    <div class="fld">
      <label>管理员账号</label>
      <input id="lu" placeholder="请输入账号" autocomplete="username"/>
    </div>
    <div class="fld">
      <label>登录密码</label>
      <input id="lp" type="password" placeholder="请输入密码" autocomplete="current-password"/>
    </div>
    <div class="fld">
      <label>密保验证 · 你喜欢的人是谁？</label>
      <div class="cap-row">
        <input id="lc" placeholder="请输入答案" autocomplete="off"/>
        <div class="cap-box" id="capBox" style="font-size:14px;font-style:normal;letter-spacing:0;width:auto;padding:0 14px">点此看问题</div>
      </div>
    </div>
    <div class="fld" style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <input type="checkbox" id="remember" style="width:auto;padding:0"/>
      <label for="remember" style="margin:0;cursor:pointer;font-size:13.5px;color:#5b6478">记住账号密码（下次自动登录）</label>
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="lg-err" id="lgErr"></div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hide">
  <div class="topbar">
    <button class="burger" onclick="toggleSide()" title="菜单"><span></span><span></span><span></span></button>
    <div class="top-title" id="pageTitle">数据概览</div>
    <div class="top-spacer"></div>
    <div class="top-user" id="topUser"></div>
    <button class="btn2 g" style="padding:7px 13px" onclick="refreshCur()">刷新</button>
  </div>

  <div class="mask" id="mask" onclick="toggleSide(false)"></div>
  <div class="side" id="side">
    <div class="side-h">
      <div class="n">小德后台</div>
      <div class="r" id="sideRole">超级管理员</div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-f">
      <button onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="main" id="content"></div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ===== 基础 ===== */
var TK=(localStorage.getItem("xdtk")||sessionStorage.getItem("xdtk")||"");
var ME=null, CUR="dash", AUTO=false;
/* 记住密码：简单混淆（base64），非安全加密，仅防肉眼泄露 */
function _enc(s){try{return btoa(unescape(encodeURIComponent(s)));}catch(e){return "";}}
function _dec(s){try{return decodeURIComponent(escape(atob(s)));}catch(e){return "";}}
function saveRemember(u,p,on){
  if(on){localStorage.setItem("xd_u",_enc(u));localStorage.setItem("xd_p",_enc(p));localStorage.setItem("xd_rm","1");}
  else{localStorage.removeItem("xd_u");localStorage.removeItem("xd_p");localStorage.removeItem("xd_rm");}
}
function loadRemember(){
  try{
    if(localStorage.getItem("xd_rm")==="1"){
      var u=_dec(localStorage.getItem("xd_u")||""),p=_dec(localStorage.getItem("xd_p")||"");
      if($("lu"))$("lu").value=u;
      if($("lp"))$("lp").value=p;
      if($("remember"))$("remember").checked=true;
      return {u:u,p:p};
    }
  }catch(e){}
  return null;
}
function $(id){return document.getElementById(id);}
function tt(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on");},1900);}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function fmtSize(b){if(!b)return "0 B";var u=["B","KB","MB","GB"],i=0;while(b>=1024&&i<3){b/=1024;i++;}return b.toFixed(i?1:0)+" "+u[i];}
function fmtTime(ts){if(!ts)return "";var d=typeof ts==="number"?new Date(ts*1000):new Date(ts);var p=function(n){return (n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}

/* ===== API ===== */
async function api(path,opt){
  opt=opt||{};
  opt.headers=opt.headers||{};
  if(TK)opt.headers["Authorization"]="Bearer "+TK;
  if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body);}
  var r=await fetch(path,opt);
  var txt=await r.text();var d;
  try{d=txt?JSON.parse(txt):{};}catch(e){d={detail:txt};}
  if(r.status===401){if(!opt.no401){logout(true);}throw new Error("登录已过期");}
  if(!r.ok)throw new Error(msgOf(d,r.status));
  return d;
}
/* 把后端返回的错误 detail（可能是字符串/数组/对象）转成可读文本 */
function msgOf(d,st){
  try{
    var x=d&&d.detail; if(x==null)x=d&&(d.message||d.msg);
    if(Array.isArray(x)){
      return x.map(function(i){
        if(i&&typeof i==="object"){
          var loc=i.loc?((Array.isArray(i.loc)?i.loc.join("."):i.loc)+": "):"";
          return loc+(i.msg||i.message||JSON.stringify(i));
        }
        return String(i);
      }).join("； ");
    }
    if(x&&typeof x==="object")return x.msg||x.message||JSON.stringify(x);
    return x?String(x):("请求失败 (HTTP "+st+")");
  }catch(e){return "请求失败 (HTTP "+st+")";}
}
function errMsg(e){return (e&&(e.message||e.msg))?String(e.message||e.msg):String(e);}

/* ===== 密保问答（固定答案） ===== */
var SEC_ANSWER="hrl";
function newCap(){ /* 保留空实现，兼容旧调用 */ }

/* ===== 登录 / 退出 ===== */
var _fail=0,_lockUntil=0;
async function doLogin(){
  var u=$("lu").value.trim(),p=$("lp").value,c=$("lc").value.trim();
  var e=$("lgErr");
  if(Date.now()<_lockUntil){e.textContent="尝试过多，请稍后 "+Math.ceil((_lockUntil-Date.now())/1000)+" 秒";return;}
  if(!u||!p){e.textContent="请输入账号和密码";return;}
  if(c.toLowerCase()!==SEC_ANSWER){e.textContent="密保答案错误";$("lc").value="";return;}
  var b=$("loginBtn");b.disabled=true;b.textContent="登录中...";e.textContent="";
  try{
    var d=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});});
    if(!d.ok)throw new Error(d.j.detail||"登录失败");
    TK=d.j.access_token||d.j.token;
    var me=await fetch("/api/auth/me",{headers:{"Authorization":"Bearer "+TK}}).then(function(r){return r.json();});
    if(!me.is_admin){throw new Error("该账号不是管理员");}
    localStorage.setItem("xdtk",TK);sessionStorage.setItem("xdtk",TK);ME=me;
    saveRemember(u,p,$("remember")&&$("remember").checked);
    _fail=0;enter();
  }catch(err){
    _fail++;if(_fail>=3){_lockUntil=Date.now()+10000;_fail=0;}
    e.textContent=err.message||"登录失败";$("lc").value="";
  } finally {b.disabled=false;b.textContent="登 录";}
}
function logout(silent){
  TK="";ME=null;localStorage.removeItem("xdtk");sessionStorage.removeItem("xdtk");
  $("app").classList.add("hide");$("login").classList.remove("hide");
  newCap();if($("lp"))$("lp").value="";if($("lc"))$("lc").value="";
  // 退出不清除「记住密码」；仅回填账号密码，方便再次登录
  loadRemember();
  if(silent)tt("登录已过期，请重新登录");
}
async function enter(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  $("topUser").textContent=(ME.nickname||ME.username||"")+(ME.username?" ("+ME.username+")":"");
  $("sideRole").textContent="超级管理员";
  buildNav();go("dash");
}

/* ===== 侧边栏 ===== */
var MENU=[
  {k:"board",ic:"📈",t:"数据看板"},
  {k:"content",ic:"🗂️",t:"内容总览"},
  {k:"dash",ic:"📊",t:"数据概览"},
  {k:"security",ic:"🔐",t:"安全管理"},
  {k:"admins",ic:"🔑",t:"管理员"},
  {k:"users",ic:"👥",t:"用户管理"},
  {k:"ban",ic:"🚫",t:"封禁管理"},
  {k:"vip",ic:"💎",t:"会员管理"},
  {k:"files",ic:"📁",t:"文件管理"},
  {k:"reqem",ic:"🎟️",t:"卡密管理"},
  {k:"directmsg",ic:"📢",t:"定向消息"},
  {k:"moments",ic:"📝",t:"帖子管理"},
  {k:"comments",ic:"💬",t:"评论管理"},
  {k:"audit",ic:"✅",t:"审核管理"},
  {k:"reviewers",ic:"👤",t:"审核员管理"},
  {k:"reports",ic:"🚨",t:"举报管理"},
  {k:"notice",ic:"📢",t:"公告管理"},
  {k:"notifs",ic:"🔔",t:"通知管理"},
  {k:"update",ic:"🔄",t:"更新管理"},
  {k:"ads",ic:"📣",t:"广告管理"},
  {k:"splash",ic:"📺",t:"开屏广告"}
];
function buildNav(){
  $("nav").innerHTML=MENU.map(function(m){
    return "<a href=\"javascript:;\" data-k=\""+m.k+"\" onclick=\"go('"+m.k+"')\"><span class=ic>"+m.ic+"</span>"+m.t+"</a>";
  }).join("");
}
function toggleSide(force){
  var on=typeof force==="boolean"?force:!$("side").classList.contains("on");
  $("side").classList.toggle("on",on);$("mask").classList.toggle("on",on);
}
function markNav(k){
  var as=$("nav").querySelectorAll("a");
  for(var i=0;i<as.length;i++)as[i].classList.toggle("on",as[i].getAttribute("data-k")===k);
}
function refreshCur(){go(CUR,true);}

/* ===== 路由 ===== */
var R={};
function go(k,keep){
  CUR=k;if(!keep)toggleSide(false);
  if(k!=="dash")markNav(k);
  var it=MENU.filter(function(m){return m.k===k;})[0];
  $("pageTitle").textContent=it?it.t:"数据概览";
  var fn=R[k]||R.dash;try{fn();}catch(e){$("content").innerHTML="<div class=empty>加载失败："+esc(e.message)+"</div>";}
}

/* ===== 启动：自动登录 / 回填记住的账号密码 ===== */
(async function boot(){
  var rm=loadRemember();
  // 已持有 token：静默校验，通过则直接进入
  if(TK){
    try{
      var me=await fetch("/api/auth/me",{headers:{"Authorization":"Bearer "+TK}}).then(function(r){return r.ok?r.json():null;});
      if(me&&me.is_admin){ME=me;enter();return;}
      TK="";localStorage.removeItem("xdtk");sessionStorage.removeItem("xdtk");
    }catch(e){TK="";localStorage.removeItem("xdtk");sessionStorage.removeItem("xdtk");}
  }
  // 勾选了记住密码：自动填充密保并尝试静默登录
  if(rm&&rm.u&&rm.p){
    var lc=$("lc");if(lc)lc.value=SEC_ANSWER;
    try{
      var d=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:rm.u,password:rm.p})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});});
      if(d.ok){
        TK=d.j.access_token||d.j.token;
        var me2=await fetch("/api/auth/me",{headers:{"Authorization":"Bearer "+TK}}).then(function(r){return r.json();});
        if(me2&&me2.is_admin){
          localStorage.setItem("xdtk",TK);sessionStorage.setItem("xdtk",TK);ME=me2;enter();return;
        }
      }
    }catch(e){}
    // 自动登录失败：清空密保温馨提示
    if(lc)lc.value="";
  }
})();
</script>
<script>
/* ===== 数据概览 ===== */
R.dash=async function(){
  $("content").innerHTML="<div class=empty>加载中...</div>";
  var s=await api("/api/admin/stats/full");
  function card(k,v,accent){return "<div class=stat><div class=k>"+k+"</div><div class=v"+(accent?" accent":"")+">"+v+"</div></div>";}
  var html="";
  html+="<div class=sec-title>👥 用户相关</div><div class=grid>";
  html+=card("注册用户总数",s.users_total,1);
  html+=card("今日新增",s.users_today);
  html+=card("近7日新增",s.users_week);
  html+=card("活跃会员",s.vip_active);
  html+=card("管理员",s.admins);
  html+="</div>";
  html+="<div class=sec-title>📝 内容相关</div><div class=grid>";
  html+=card("帖子总数",s.moments_total,1);
  html+=card("待审帖子",s.moments_pending);
  html+=card("今日发帖",s.moments_today);

async function vipPlanSave(id){
  var name = ($("fName").value||"").trim();
  var price = parseFloat($("fPrice").value);
  var days = parseInt($("fDays").value);
  var gift = parseInt($("fGift").value||"0")||0;
  var badge = ($("fBadge").value||"").trim();
  var intro = ($("fIntro").value||"").trim();
  var sort = parseInt($("fSort").value||"99")||99;
  var enabled = $("fEnabled").checked;

  if(!name){ $("fErr").textContent="请填写套餐名称"; return; }
  if(!(price>=0)){ $("fErr").textContent="价格必须 ≥ 0"; return; }
  if(!(days>0)){ $("fErr").textContent="时长必须大于 0 天"; return; }

  var body = {name:name, price:price, days:days, gift_days:gift,
              badge:badge, intro:intro, sort:sort, enabled:enabled};
  try{
    if(id===null) await api("/api/admin/vip/plans",{method:"POST",body:body});
    else await api("/api/admin/vip/plans/"+id,{method:"PUT",body:body});
    tt(id===null?"套餐已创建":"已保存");
    vipPlanPane();
  }catch(e){
    $("fErr").textContent = e.message;
  }
}

async function banUser(id,ban){
  var reason="",days=0;
  if(ban){
    var d=prompt("封禁天数（留空或 0 = 永久封禁）:","");
    if(d===null)return;
    d=(d||"").trim();
    if(d!==""){days=parseInt(d,10);if(isNaN(days)||days<0)days=0;}
    reason=prompt("封禁理由（可留空）:");
    if(reason===null)return;
  } else {
    if(!confirm("确认解封该用户？"))return;
  }
  try{
    await api("/api/admin/users/"+id+"/ban",{method:"POST",body:{ban:!!ban,reason:reason,days:days}});
    tt(ban?(days>0?("已封禁 "+days+" 天"):"已永久封禁"):"已解封");

  }catch(e){tt(e.message);}

  if(!list.length){$("nflist").innerHTML="<div class=empty>没有通知</div>";return;}
  $("nflist").innerHTML=list.map(function(n){
    return "<div class=item><div class=m>#"+n.id+" · 接收:"+esc(n.user_name)+"(#"+n.user_id+") · 触发:"+esc(n.actor_name)+" · "+esc(n.type)+" · "+fmtTime(n.created_at)+(n.is_read?" · 已读":" · <b>未读</b>")+"</div>"+
      "<div style='margin:4px 0'>"+esc(n.content)+"</div>"+
      "<div><button class='btn2 r' style='padding:5px 12px;font-size:13px' onclick='delNotif("+n.id+")'>删除</button></div></div>";
  }).join("");
}
async function delNotif(id){
  if(!confirm("确认删除该通知？"))return;
  try{await api("/api/admin/notifications/"+id,{method:"DELETE"});tt("已删除");loadNotifs();}catch(e){tt(e.message);}
}

/* ---------- 🔑 管理员管理 ---------- */
R.admins=async function(){
  var h="<div class=card><div class=sec-title style='margin-top:0'>🔑 管理员列表</div><div id=admlist><div class=empty>加载中...</div></div></div>";
  $("content").innerHTML=h;await loadAdmins();
};
async function loadAdmins(){
  var list=await api("/api/admin/admins").catch(function(){return [];});
  if(!list.length){$("admlist").innerHTML="<div class=empty>没有管理员</div>";return;}
  $("admlist").innerHTML=list.map(function(u){
    return "<div class=item><div class=m><b>#"+u.id+"</b> "+esc(u.username)+" · "+esc(u.nickname||"")+"</div>"+
      "<div class=muted style='margin-bottom:8px'>注册 "+fmtTime(u.created_at)+"</div>"+
      "<div style='display:flex;gap:6px;flex-wrap:wrap'>"+
      "<button class='btn2 g' style='padding:6px 12px;font-size:13px' onclick='setAdmPwd("+u.id+")'>重置密码</button>"+
      (u.id===(ME&&ME.id)?"":'<button class="btn2 r" style="padding:6px 12px;font-size:13px" onclick="revokeAdm('+u.id+')">取消管理员</button>')+
      "</div></div>";
  }).join("");
}
async function setAdmPwd(id){
  var np=prompt("输入新密码（≥6位）:");if(!np)return;
  if(np.length<6){tt("密码至少6位");return;}
  try{await api("/api/admin/admins/"+id+"/password",{method:"POST",body:{password:np}});tt("密码已重置");}catch(e){tt(e.message);}
}
async function revokeAdm(id){
  if(!confirm("确认取消该用户的管理员身份？"))return;
  try{await api("/api/admin/admins/"+id+"/revoke",{method:"POST"});tt("已取消");loadAdmins();}catch(e){tt(e.message);}
}

/* ---------- 🖼️ 应用编辑弹窗 ---------- */
async function editApp(id){
  var list=await api("/api/admin/apps?limit=500").catch(function(){return [];});
  var a=null;for(var i=0;i<list.length;i++)if(list[i].id===id)a=list[i];
  if(!a){tt("应用不存在");return;}
  var h="<div class=mask on id=appMask><div class=modal style='max-width:560px'>";
  h+="<div class=sec-title style='margin-top:0'>🖼️ 编辑应用 #"+a.id+"</div>";
  h+="<div class=fld><label>应用名</label><input id=ea_name value=\""+esc(a.name)+"\"></div>";
  h+="<div class=fld><label>包名</label><input id=ea_pkg value=\""+esc(a.package_name)+"\"></div>";
  h+="<div class=fld><label>版本</label><input id=ea_ver value=\""+esc(a.version)+"\"></div>";
  h+="<div class=fld><label>分类</label><input id=ea_cat value=\""+esc(a.category)+"\"></div>";
  h+="<div class=fld><label>简介</label><input id=ea_sum value=\""+esc(a.summary)+"\"></div>";
  h+="<div class=fld><label>图标 URL</label><input id=ea_icon value=\""+esc(a.icon)+"\"></div>";
  h+="<div class=fld><label>截图 URL（逗号分隔）</label><textarea id=ea_shots rows=2>"+esc((a.screenshots||[]).join(","))+"</textarea></div>";
  h+="<div class=fld><label>详细描述</label><textarea id=ea_desc rows=3>"+esc(a.description)+"</textarea></div>";
  h+="<div class=fld><label>下载地址/外链</label><input id=ea_link value=\""+esc(a.ext_link||a.apk_url)+"\"></div>";
  h+="<div class=row style='justify-content:flex-end'><button class='btn2 g' onclick='closeMask(\"appMask\")'>取消</button><button class=btn2 onclick='saveApp("+a.id+")'>保存</button></div>";
  h+="</div></div>";
  document.body.insertAdjacentHTML("beforeend",h);
}
function closeMask(id){var e=$(id);if(e)e.remove();}
async function saveApp(id){
  var body={
    name:$("ea_name").value,package_name:$("ea_pkg").value,version:$("ea_ver").value,
    category:$("ea_cat").value,summary:$("ea_sum").value,icon:$("ea_icon").value,
    screenshots:$("ea_shots").value.split(",").map(function(x){return x.trim();}).filter(function(x){return x;}),
    description:$("ea_desc").value,ext_link:$("ea_link").value
  };
  try{await api("/api/admin/apps/"+id,{method:"PUT",body:body});tt("已保存");closeMask("appMask");if(CUR==="audit")loadAuditA();}catch(e){tt(errMsg(e));}
}
